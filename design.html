<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>AI Wedding Designer · 6athome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Cormorant+Garamond:wght@400;500&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe9;--panel:#fffdf9;--text:#28211d;--muted:#887b71;--line:#ddd3c9;--accent:#7d2a1f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",sans-serif}
.shell{max-width:980px;margin:0 auto;padding:28px 18px 80px}
.header{text-align:center;margin:24px 0 36px}.header small{letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.header h1{font-family:"Playfair Display",serif;font-weight:500;font-size:clamp(32px,7vw,54px);margin:8px 0}.header p{color:var(--muted);line-height:1.7}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 34px rgba(48,33,24,.07);margin-bottom:18px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:8px}textarea,input{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fff;outline:none}textarea{min-height:110px;resize:vertical;line-height:1.7}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px}.chip{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:white;cursor:pointer;font-size:13px}.chip.active{background:#2e2925;color:white;border-color:#2e2925}
.btn{border:1px solid var(--line);border-radius:10px;padding:12px 17px;background:white;cursor:pointer;font:inherit;font-weight:500;text-decoration:none;color:inherit}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.usage{color:var(--muted);font-size:13px;margin-left:auto}
.notice{display:none;margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13px}.notice.show{display:block}.notice.error{background:#fff0f0;color:#8a2929}.notice.ok{background:#edf6ee;color:#28522f}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.theme{border:2px solid transparent;border-radius:16px;overflow:hidden;background:white;box-shadow:0 8px 22px rgba(0,0,0,.06);cursor:pointer;transition:.2s}.theme:hover{transform:translateY(-3px)}.theme.selected{border-color:#2d4a2b}
.preview{height:250px;padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center}.preview .kicker{font-size:10px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:18px;opacity:.72}.preview h3{font-size:28px;font-weight:400;margin:0 0 13px}.preview p{font-size:12px;line-height:1.7;margin:0;opacity:.82}.preview .photo{width:80%;height:72px;margin:20px auto 0;background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.09)}
.theme-info{padding:15px;border-top:1px solid #eee}.theme-info strong{display:block;margin-bottom:5px}.theme-info p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.apply-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:24px}
.loading{text-align:center;padding:50px 0;color:var(--muted)}
@media(max-width:760px){.themes{grid-template-columns:1fr}.preview{height:210px}.usage{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <small>6athome wedding</small>
    <h1>AI Wedding Designer</h1>
    <p>두 분의 취향을 알려주세요.<br>청첩장 구조는 그대로 두고 컬러·폰트·사진 분위기를 AI가 제안합니다.</p>
  </header>

  <div id="loading" class="panel loading">디자인 페이지를 준비하고 있습니다...</div>

  <div id="app" style="display:none;">
    <section class="panel">
      <label for="prompt">원하는 분위기를 자유롭게 적어주세요</label>
      <textarea id="prompt" maxlength="700" placeholder="예: 오래된 유럽 레스토랑 같은 분위기. 버건디와 크림색을 좋아하고 너무 전형적인 웨딩 느낌은 싫어요. 약간 귀엽고 잡지 같은 느낌이면 좋겠어요."></textarea>

      <label style="margin-top:18px;">분위기</label>
      <div class="chips">
        <button class="chip" type="button" data-value="minimal">미니멀</button>
        <button class="chip" type="button" data-value="vintage">빈티지</button>
        <button class="chip" type="button" data-value="romantic">로맨틱</button>
        <button class="chip" type="button" data-value="playful">키치</button>
        <button class="chip" type="button" data-value="modern">모던</button>
        <button class="chip" type="button" data-value="natural">내추럴</button>
      </div>

      <label for="colors">좋아하는 색상 또는 피하고 싶은 색상</label>
      <input id="colors" maxlength="180" placeholder="예: 버건디, 크림 / 핑크는 싫어요">

      <div class="actions" style="margin-top:20px;">
        <button class="btn primary" id="generateBtn" type="button">✨ AI 시안 3개 만들기</button>
        <span class="usage" id="usage"></span>
      </div>
      <div class="notice" id="notice"></div>
    </section>

    <section class="themes" id="themes"></section>
    <div class="apply-row" id="applyRow" style="display:none;">
      <button class="btn primary" id="applyBtn" type="button">이 디자인 적용하기</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://gfpdjxdoxjonramxrlgi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_NUhd1LmMj09rtA5RMcgAxA_cMKIuZB6";
const FUNCTION_URL=SUPABASE_URL+"/functions/v1/ai-wedding-theme";
const token=new URLSearchParams(location.search).get("token")||"";
let selectedMoods=[],themes=[],selectedIndex=-1,weddingSlug="";
const $=id=>document.getElementById(id);

function showNotice(message,type="ok"){const n=$("notice");n.textContent=message;n.className="notice show "+type;}
function clearNotice(){$("notice").className="notice";}
function fontFamily(key){return {playfair:'"Playfair Display",serif',cormorant:'"Cormorant Garamond",serif',myeongjo:'"Nanum Myeongjo",serif',noto_sans:'"Noto Sans KR",sans-serif'}[key]||'"Playfair Display",serif';}
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}

async function callFunction(action,payload={}){
  const res=await fetch(FUNCTION_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},
    body:JSON.stringify({action,token,...payload})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||"요청 처리에 실패했습니다.");
  return data;
}

document.querySelectorAll(".chip").forEach(btn=>{
  btn.addEventListener("click",()=>{
    btn.classList.toggle("active");
    selectedMoods=Array.from(document.querySelectorAll(".chip.active")).map(x=>x.dataset.value);
  });
});

function renderThemes(){
  const wrap=$("themes");wrap.innerHTML="";
  themes.forEach((t,i)=>{
    const card=document.createElement("article");
    card.className="theme"+(selectedIndex===i?" selected":"");
    card.addEventListener("click",()=>{selectedIndex=i;renderThemes();$("applyRow").style.display="flex";});
    const p=t.design;
    card.innerHTML=`
      <div class="preview" style="background:${p.background};color:${p.foreground};border-radius:${p.border_radius==="large"?"24px":p.border_radius==="medium"?"14px":p.border_radius==="small"?"6px":"0"}">
        <div class="kicker">SAVE THE DATE</div>
        <h3 style="font-family:${fontFamily(p.heading_font)}">${escapeHtml(t.name)}</h3>
        <p>${escapeHtml(t.description)}</p>
        <div class="photo" style="border-radius:${p.photo_style==="rounded"?"16px":p.photo_style==="polaroid"?"2px":"0"};border-color:${p.accent}"></div>
      </div>
      <div class="theme-info"><strong>${escapeHtml(t.name)}</strong><p>${escapeHtml(t.description)}</p></div>`;
    wrap.appendChild(card);
  });
}

$("generateBtn").addEventListener("click",async()=>{
  clearNotice();
  const prompt=$("prompt").value.trim();
  if(prompt.length<10){showNotice("원하는 분위기를 조금 더 자세히 적어주세요.","error");return;}
  $("generateBtn").disabled=true;$("generateBtn").textContent="AI가 디자인 중...";
  try{
    const data=await callFunction("generate",{prompt,moods:selectedMoods,colors:$("colors").value.trim()});
    themes=data.themes||[];selectedIndex=-1;renderThemes();$("applyRow").style.display="none";
    $("usage").textContent=`AI 생성권 ${data.used} / ${data.max}회 사용`;
    showNotice("3개의 디자인 시안을 만들었습니다.");
  }catch(e){showNotice(e.message,"error");}
  finally{$("generateBtn").disabled=false;$("generateBtn").textContent="✨ AI 시안 3개 만들기";}
});

$("applyBtn").addEventListener("click",async()=>{
  if(selectedIndex<0||!themes[selectedIndex])return;
  $("applyBtn").disabled=true;$("applyBtn").textContent="적용 중...";
  try{
    await callFunction("apply",{design:themes[selectedIndex].design});
    showNotice("디자인을 적용했습니다. 실제 청첩장에서 바로 확인할 수 있어요.");
    if(weddingSlug && !document.getElementById("previewLink")){
      const a=document.createElement("a");a.id="previewLink";a.className="btn";a.target="_blank";a.rel="noopener";
      a.href="https://6athome.github.io/Wedding/?slug="+encodeURIComponent(weddingSlug);
      a.textContent="청첩장 확인하기";$("applyRow").appendChild(a);
    }
  }catch(e){showNotice(e.message,"error");}
  finally{$("applyBtn").disabled=false;$("applyBtn").textContent="이 디자인 적용하기";}
});

(async function init(){
  if(!token){$("loading").textContent="유효한 디자인 링크가 아닙니다.";return;}
  try{
    const data=await callFunction("session");
    weddingSlug=data.slug;
    $("usage").textContent=`AI 생성권 ${data.used} / ${data.max}회 사용`;
    $("loading").style.display="none";$("app").style.display="block";
  }catch(e){$("loading").textContent=e.message;}
})();
</script>
</body>
</html>
