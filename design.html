<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Wedding Stylist · V3</title>
<style>
*{box-sizing:border-box} :root{--ink:#221d19;--muted:#81776e;--paper:#f3efe8;--line:#d9d0c5;--wine:#6f251d}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
.shell{max-width:1160px;margin:auto;padding:52px 24px 90px}.header{text-align:center;margin-bottom:34px}.header small{letter-spacing:.24em;font-size:10px}.header h1{font-family:Georgia,serif;font-weight:400;font-size:38px;margin:10px 0}.header p{color:var(--muted);line-height:1.8}
.panel{background:rgba(255,255,255,.62);border:1px solid rgba(80,60,45,.12);border-radius:22px;padding:26px;margin-bottom:28px}
label{display:block;font-size:13px;font-weight:650;margin-bottom:9px} textarea,input{width:100%;border:1px solid var(--line);background:#fffdf9;border-radius:12px;padding:14px;font:inherit;color:inherit}textarea{min-height:112px;resize:vertical}
.color-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0}.swatch{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 11px;font-size:11px;cursor:pointer}.swatch.active{outline:2px solid var(--ink);outline-offset:2px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid rgba(0,0,0,.12);vertical-align:-1px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 18px;font-weight:650;cursor:pointer;color:inherit;text-decoration:none;font-size:13px}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.usage,.privacy,.notice{font-size:11px;color:var(--muted);line-height:1.7}.privacy{margin-top:16px}.notice{margin-top:12px}.notice.error{color:#a12e23}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.theme{background:#fff;border:1px solid transparent;border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 10px 35px rgba(55,40,30,.07)}.theme.selected{outline:2px solid var(--ink);outline-offset:3px}.preview{height:510px;overflow:hidden}.theme-info{padding:16px 17px 18px}.theme-info strong{font-family:Georgia,serif;font-weight:400;font-size:18px}.theme-info p{margin:5px 0 0;color:var(--muted);font-size:11px}.palette{display:flex;gap:5px;margin-top:10px}.palette i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.qe{height:100%;position:relative;background:var(--bg);color:var(--fg);padding:20px}.qe .photo{height:76%;overflow:hidden}.qe img{width:100%;height:100%;object-fit:cover}.qe .save{position:absolute;top:34px;left:34px;color:white;font:12px/1.5 Georgia,serif;letter-spacing:.18em}.qe .names{font:28px/1.05 Georgia,serif;margin-top:22px}.qe .date{font-size:8px;letter-spacing:.16em;margin-top:8px;color:var(--accent)}
.ti{height:100%;background:var(--bg);color:var(--fg);padding:24px;position:relative}.ti .save{font:10px Georgia,serif;letter-spacing:.14em;color:var(--accent)}.ti .big{font:44px/.9 Georgia,serif;margin-top:58px;letter-spacing:-.04em}.ti .amp{font:30px Georgia,serif;color:var(--accent);margin:12px 0}.ti .photo{position:absolute;left:24px;right:24px;bottom:76px;height:38%;overflow:hidden}.ti img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}.ti .script{position:absolute;bottom:30px;right:24px;font:italic 17px Georgia,serif;color:var(--accent)}
.lp{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}.lp .letter{height:52%;position:relative;padding:22px;background:color-mix(in srgb,var(--bg) 86%,white)}.lp .flap{position:absolute;inset:0 0 auto;height:44%;background:color-mix(in srgb,var(--bg) 75%,white);clip-path:polygon(0 0,100% 0,50% 100%)}.lp .card{position:absolute;width:76%;left:12%;top:52px;background:#fffdf8;padding:28px 16px;text-align:center;box-shadow:0 5px 18px rgba(0,0,0,.08);transform:rotate(-1deg)}.lp .card b{display:block;font:italic 24px Georgia,serif;font-weight:400}.lp .card span{font-size:8px;letter-spacing:.13em;color:var(--accent)}.lp .book{height:48%;background:color-mix(in srgb,var(--accent) 18%,var(--bg));padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.lp .book div{background:#fff;padding:6px 6px 18px;box-shadow:0 4px 12px rgba(0,0,0,.1);transform:rotate(-2deg)}.lp .book div:nth-child(2){transform:rotate(2deg);margin-top:18px}.lp img{width:100%;height:100%;object-fit:cover}
.bottom{display:none;margin-top:26px}.refine{display:flex;gap:8px;margin-top:14px}.refine input{flex:1}
@media(max-width:800px){.themes{grid-template-columns:1fr}.theme{max-width:420px;margin:auto;width:100%}.color-row{grid-template-columns:1fr}.preview{height:560px}.shell{padding:30px 15px 70px}}
</style>
</head>
<body><main class="shell">
<header class="header"><small>6ATHOME WEDDING</small><h1>AI Wedding Stylist</h1><p>완성된 세 가지 디자인을<br>우리의 분위기와 색으로 스타일링해보세요.</p></header>
<div id="loading" class="panel">디자인 페이지를 준비하고 있습니다...</div>
<div id="app" style="display:none">
<section class="panel">
<label for="prompt">원하는 분위기를 자유롭게 적어주세요</label>
<textarea id="prompt" maxlength="700" placeholder="예: 너무 웨딩스럽지 않고 차분했으면 좋겠어요. 잡지 같은 느낌에 빈티지가 살짝 섞였으면 좋겠어요."></textarea>
<div class="color-row">
<div><label>원하는 배경색</label><div class="swatches" id="bgSwatches"></div><input id="background" maxlength="80" placeholder="예: 아이보리, 탁한 하늘색"></div>
<div><label>원하는 포인트 색상</label><div class="swatches" id="accentSwatches"></div><input id="accent" maxlength="80" placeholder="예: 진한 버건디, 실버"></div>
</div>
<div class="actions" style="margin-top:22px"><button class="btn primary" id="generateBtn">세 디자인 스타일링하기</button><span id="usage" class="usage"></span></div>
<div class="privacy">AI에는 이 화면에 직접 입력한 분위기와 색상, 추상적인 디자인 설정만 전달됩니다. 이름·날짜·장소·연락처·계좌·RSVP·사진은 AI로 전송하지 않습니다.</div><div id="notice" class="notice"></div>
</section>
<section id="themes" class="themes"></section>
<section id="bottom" class="panel bottom"><div class="actions"><button class="btn primary" id="applyBtn">이 디자인 적용하기</button></div><div class="refine"><input id="refineInput" maxlength="300" placeholder="예: 버건디를 조금 더 어둡게, 사진은 자연스럽게"><button class="btn" id="refineBtn">AI로 미세조정</button></div></section>
</div></main>
<script>
const SUPABASE_URL="https://gfpdjxdoxjonramxrlgi.supabase.co";
const FN=SUPABASE_URL+"/functions/v1/ai-wedding-theme";
const token=new URLSearchParams(location.search).get("token")||"";
let themes=[],sel=-1,slug="",preview={};
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function note(t,e=""){let n=$("notice");n.textContent=t;n.className="notice "+e}
async function call(action,extra={}){let r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,token,...extra})});let d=await r.json();if(!r.ok)throw new Error(d.error||"요청에 실패했습니다.");return d}
const bg=[["Ivory","#f3eee3"],["White","#ffffff"],["Butter","#ead9aa"],["Sky","#a9c2d6"],["Blush","#e7c8c5"],["Stone","#c9c0b4"],["Black","#181818"]];
const ac=[["Burgundy","#6f251d"],["Red","#a8342a"],["Pink","#d67f9b"],["Navy","#24334a"],["Blue","#4f7397"],["Green","#66775b"],["Silver","#aaa9a4"],["Black","#181818"]];
function chips(id,data,input){let w=$(id);data.forEach(([n,c])=>{let b=document.createElement("button");b.className="swatch";b.innerHTML=`<i class="dot" style="background:${c}"></i>${n}`;b.onclick=()=>{[...w.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");$(input).value=n};w.appendChild(b)})}
chips("bgSwatches",bg,"background");chips("accentSwatches",ac,"accent");
function img(i=0){return esc((preview.moment_images||[])[i]||preview.hero_image_url||"")}
function card(t){let d=t.design||{},bgc=d.background_hex||"#f3eee3",acc=d.accent_hex||"#6f251d",fg=(bgc.toLowerCase()==="#181818"?"#f7f2eb":"#211c18"),p=img(0),p2=img(1)||p;
if(d.template==="type_image")return `<div class="preview ti" style="--bg:${bgc};--accent:${acc};--fg:${fg}"><div class="save">SAVE THE DATE</div><div class="big">${esc(preview.groom_name||"JUNWOO")}</div><div class="amp">&</div><div class="big">${esc(preview.bride_name||"HAYEON")}</div><div class="photo">${p?`<img src="${p}">`:""}</div><div class="script">we are getting married</div></div>`;
if(d.template==="letter_photobook")return `<div class="preview lp" style="--bg:${bgc};--accent:${acc};--fg:${fg}"><div class="letter"><div class="flap"></div><div class="card"><b>Save<br>the Date</b><br><span>${esc(preview.groom_name||"GROOM")} & ${esc(preview.bride_name||"BRIDE")}</span></div></div><div class="book"><div>${p?`<img src="${p}">`:""}</div><div>${p2?`<img src="${p2}">`:""}</div></div></div>`;
return `<div class="preview qe" style="--bg:${bgc};--accent:${acc};--fg:${fg}"><div class="photo">${p?`<img src="${p}">`:""}</div><div class="save">SAVE<br>THE<br>DATE</div><div class="names">${esc(preview.groom_name||"GROOM")}<br>& ${esc(preview.bride_name||"BRIDE")}</div><div class="date">${esc(preview.date_summary||"OUR WEDDING DAY")}</div></div>`}
function render(){let w=$("themes");w.innerHTML="";themes.forEach((t,i)=>{let a=document.createElement("article");a.className="theme"+(i===sel?" selected":"");a.onclick=()=>{sel=i;render();$("bottom").style.display="block"};a.innerHTML=card(t)+`<div class="theme-info"><strong>${esc(t.name)}</strong><p>${esc(t.subtitle||"")}</p><div class="palette"><i style="background:${esc(t.design.background_hex)}"></i><i style="background:${esc(t.design.accent_hex)}"></i></div></div>`;w.appendChild(a)})}
$("generateBtn").onclick=async()=>{let p=$("prompt").value.trim(),background=$("background").value.trim(),accent=$("accent").value.trim();if(p.length<10)return note("원하는 분위기를 조금 더 자세히 적어주세요.","error");if(!background)return note("원하는 배경색을 선택하거나 적어주세요.","error");if(!accent)return note("원하는 포인트 색상을 선택하거나 적어주세요.","error");let b=$("generateBtn");b.disabled=true;b.textContent="세 디자인을 스타일링 중...";try{let d=await call("generate",{prompt:p,background,accent});themes=d.themes||[];sel=-1;render();$("bottom").style.display="none";$("usage").textContent=`AI 생성권 ${d.used} / ${d.max}회 사용`;note("같은 취향으로 세 가지 고정 디자인을 스타일링했습니다.")}catch(e){note(e.message,"error")}finally{b.disabled=false;b.textContent="세 디자인 스타일링하기"}};
$("refineBtn").onclick=async()=>{if(sel<0)return;let q=$("refineInput").value.trim();if(q.length<2)return note("어떻게 바꾸고 싶은지 짧게 적어주세요.","error");let b=$("refineBtn");b.disabled=true;try{let d=await call("refine",{request:q,current:themes[sel]});themes[sel]=d.theme;render();$("usage").textContent=`AI 생성권 ${d.used} / ${d.max}회 사용`;note("선택한 디자인의 스타일만 조정했습니다.")}catch(e){note(e.message,"error")}finally{b.disabled=false}};
$("applyBtn").onclick=async()=>{if(sel<0)return;let b=$("applyBtn");b.disabled=true;try{await call("apply",{design:themes[sel].design});note("디자인을 적용했습니다.");if(slug&&!$("view")){let a=document.createElement("a");a.id="view";a.className="btn";a.target="_blank";a.href="https://6athome.github.io/Wedding/?slug="+encodeURIComponent(slug);a.textContent="청첩장 확인하기";b.after(a)}}catch(e){note(e.message,"error")}finally{b.disabled=false}};
(async()=>{if(!token){$("loading").textContent="유효한 디자인 링크가 아닙니다.";return}try{let d=await call("session");slug=d.slug;preview=d.preview||{};$("usage").textContent=`AI 생성권 ${d.used} / ${d.max}회 사용`;$("loading").style.display="none";$("app").style.display="block"}catch(e){$("loading").textContent=e.message}})();
</script></body></html>
