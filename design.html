<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"><title>AI Wedding Designer · 6athome</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Cormorant+Garamond:wght@400;500&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2eee8;--panel:#fffdf9;--text:#28211d;--muted:#897c72;--line:#ddd3c9;--accent:#6f271e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",sans-serif}
.shell{max-width:1140px;margin:auto;padding:28px 18px 90px}.header{text-align:center;margin:24px 0 34px}.header small{letter-spacing:.18em;color:var(--muted)}.header h1{font-family:"Playfair Display",serif;font-weight:500;font-size:clamp(34px,7vw,58px);margin:8px}.header p{color:var(--muted);line-height:1.75}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 34px rgba(48,33,24,.06);margin-bottom:22px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:8px}textarea,input{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fff;outline:none}textarea{min-height:105px;resize:vertical;line-height:1.7}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px}.chip,.btn{border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:white;cursor:pointer;font:inherit}.chip.active{background:#292522;color:#fff;border-color:#292522}.btn{border-radius:10px;padding:12px 17px;font-weight:500}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn:disabled{opacity:.5}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.usage{margin-left:auto;color:var(--muted);font-size:13px}
.notice{display:none;margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13px}.notice.show{display:block}.notice.error{background:#fff0f0;color:#8a2929}.notice.ok{background:#edf6ee;color:#28522f}
.privacy{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.65}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.theme{background:#fff;border:2px solid transparent;border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 9px 26px rgba(0,0,0,.07);transition:.2s}.theme:hover{transform:translateY(-3px)}.theme.selected{border-color:#294b2b}
.phone-wrap{padding:18px;background:#e8e2da}.phone{width:100%;aspect-ratio:9/16;border-radius:24px;overflow:hidden;position:relative;box-shadow:0 10px 25px rgba(0,0,0,.14);display:flex;flex-direction:column}
.p-hero{position:relative;overflow:hidden}.p-hero img{width:100%;height:100%;object-fit:cover;display:block}.p-hero.noimg{background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(0,0,0,.08))}
.p-copy{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;justify-content:flex-end}.p-kicker{font-size:8px;letter-spacing:.2em;margin-bottom:6px}.p-names{line-height:1.03;margin:0}.p-date{font-size:9px;margin-top:8px;opacity:.82}
.p-body{flex:1;padding:14px;display:flex;flex-direction:column}.p-line{height:1px;width:34%;margin-bottom:9px}.p-text{font-size:8px;line-height:1.65;opacity:.78;margin-bottom:10px}.p-moments{display:grid;gap:4px;flex:1;min-height:0}.p-moments img,.ph{width:100%;height:100%;object-fit:cover;min-width:0;min-height:0;background:rgba(255,255,255,.2)}
.theme-info{padding:15px}.theme-info strong{display:block;margin-bottom:5px}.theme-info p{font-size:12px;color:var(--muted);line-height:1.55;margin:0}.preset{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9b8e84;margin-top:8px}
.bottom{display:none;text-align:center;margin-top:26px}.refine{max-width:700px;margin:15px auto 0;display:flex;gap:8px}.refine input{flex:1}.loading{text-align:center;padding:45px;color:var(--muted)}
@media(max-width:840px){.themes{grid-template-columns:1fr;max-width:430px;margin:auto}.usage{width:100%;margin-left:0}.phone{aspect-ratio:9/14}.refine{flex-direction:column}}

/* DESIGN FAMILY V2.1 PREVIEWS */
.v21-preview{height:390px;overflow:hidden;position:relative}
.v21-photo{background:#eee9df;padding:12px;height:100%}.v21-photo .film{background:white;border-radius:15px;padding:10px;height:100%}.v21-photo .shot{height:62%;overflow:hidden;border-radius:9px;background:#ddd}.v21-photo .shot img{width:100%;height:100%;object-fit:cover}.v21-photo .rail{display:flex;justify-content:space-between;font-size:7px;padding-top:7px}.v21-photo .caption{text-align:center;padding-top:24px}.v21-photo .caption strong{display:block;font-size:20px}
.v21-doodle{background:#fffdf8;color:#111;height:100%;padding:18px;text-align:center}.v21-doodle .hand{font-family:"Comic Sans MS",cursive;font-size:23px;transform:rotate(-2deg)}.v21-doodle .poster{border:3px solid #111;margin:18px auto 0;padding:8px;width:78%;transform:rotate(1deg)}.v21-doodle .poster img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1)}.v21-doodle .gb{display:flex;justify-content:space-between;font-family:"Comic Sans MS",cursive;font-size:15px}
.v21-kitsch{height:100%;background:#222;position:relative;overflow:hidden}.v21-kitsch>img{width:100%;height:100%;object-fit:cover;filter:grayscale(.8)}.v21-kitsch .heart{position:absolute;left:9%;right:9%;bottom:8%;height:42%;background:#ff4774;clip-path:polygon(50% 100%,5% 42%,10% 16%,29% 5%,50% 22%,71% 5%,90% 16%,95% 42%);display:flex;align-items:center;justify-content:center;text-align:center;color:#111;padding:36px 20px 10px}.v21-kitsch .dots span{position:absolute;width:20px;height:20px;border-radius:50%;background:#ff4774;color:#111;font-size:8px;display:grid;place-items:center}.v21-kitsch .dots span:nth-child(1){left:8%;top:38%}.v21-kitsch .dots span:nth-child(2){right:12%;top:43%}.v21-kitsch .dots span:nth-child(3){left:28%;top:48%}
.v21-retro{height:100%;background:#181818;color:#f5ece8;text-align:center;padding:22px}.v21-retro .script{font-family:"Cormorant Garamond",serif;font-style:italic;color:#e78aab;font-size:30px}.v21-retro .lace{border:6px double #f5ece8;width:72%;margin:22px auto 20px;padding:9px;border-radius:48% 48% 40% 40% / 28% 28% 33% 33%}.v21-retro .lace img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:45% 45% 37% 37% / 26% 26% 31% 31%}.v21-retro .small{font-size:9px;line-height:1.7}
.v21-paper{height:100%;background:#f4f0e6;color:#4b463f;text-align:center;padding:20px}.v21-paper .inv{font-size:8px;letter-spacing:.3em}.v21-paper .polaroid{width:50%;margin:32px auto 24px;background:white;padding:7px 7px 23px;box-shadow:0 4px 15px rgba(0,0,0,.12);transform:rotate(-2deg);position:relative}.v21-paper .polaroid::before{content:"";position:absolute;width:45px;height:10px;background:rgba(202,181,140,.48);top:-5px;left:50%;transform:translateX(-50%) rotate(2deg)}.v21-paper .polaroid img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(.7)}.v21-paper .poem{font-size:9px;line-height:1.9}

</style></head><body><div class="shell">
<header class="header"><small>6ATHOME WEDDING</small><h1>AI Wedding Designer</h1><p>취향만 알려주세요.<br>같은 사진과 내용으로 서로 다른 세 가지 청첩장 방향을 제안합니다.</p></header>
<div id="loading" class="panel loading">디자인 페이지를 준비하고 있습니다...</div>
<div id="app" style="display:none"><section class="panel">
<label for="prompt">원하는 분위기를 자유롭게 적어주세요</label><textarea id="prompt" maxlength="700" placeholder="예: 오래된 유럽 레스토랑 같은 분위기. 버건디와 크림을 좋아하고 너무 전형적인 웨딩 느낌은 싫어요. 잡지처럼 감도 높았으면 좋겠어요."></textarea>
<label style="margin-top:18px">분위기 <span style="font-weight:400;color:var(--muted)">· 최대 3개</span></label>
<div class="chips"><button class="chip" data-value="minimal">미니멀</button><button class="chip" data-value="vintage">빈티지</button><button class="chip" data-value="romantic">로맨틱</button><button class="chip" data-value="playful">키치</button><button class="chip" data-value="modern">모던</button><button class="chip" data-value="natural">내추럴</button></div>
<label for="colors">좋아하는 색 / 피하고 싶은 색</label><input id="colors" maxlength="180" placeholder="예: 버건디, 크림 / 핑크는 싫어요">
<div class="actions" style="margin-top:20px"><button class="btn primary" id="generateBtn">✨ 우리 취향으로 디자인하기</button><span class="usage" id="usage"></span></div>
<div class="privacy">AI에는 이 화면에 직접 입력한 디자인 취향과 추상적인 디자인 설정만 전달됩니다. 이름·날짜·장소·연락처·계좌·RSVP·사진은 OpenAI 요청에 포함하지 않습니다.</div><div class="notice" id="notice"></div>
</section>
<section class="themes" id="themes"></section>
<div class="bottom" id="bottom"><button class="btn primary" id="applyBtn">이 디자인 적용하기</button>
<div class="refine"><input id="refineInput" maxlength="300" placeholder="예: 이 느낌에서 조금 더 밝고 미니멀하게"><button class="btn" id="refineBtn">AI로 미세조정</button></div></div>
</div></div>
<script>
const U="https://gfpdjxdoxjonramxrlgi.supabase.co",K="sb_publishable_NUhd1LmMj09rtA5RMcgAxA_cMKIuZB6",F=U+"/functions/v1/ai-wedding-theme";
const token=new URLSearchParams(location.search).get("token")||"";let moods=[],themes=[],sel=-1,slug="",preview={};const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const ff=k=>({playfair:'"Playfair Display",serif',cormorant:'"Cormorant Garamond",serif',myeongjo:'"Nanum Myeongjo",serif',noto_sans:'"Noto Sans KR",sans-serif'}[k]||'"Playfair Display",serif');
function note(m,t="ok"){let n=$("notice");n.textContent=m;n.className="notice show "+t}
async function call(action,p={}){let r=await fetch(F,{method:"POST",headers:{"Content-Type":"application/json","apikey":K},body:JSON.stringify({action,token,...p})});let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"요청 실패");return d}
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(!b.classList.contains("active")&&document.querySelectorAll(".chip.active").length>=3)return;b.classList.toggle("active");moods=[...document.querySelectorAll(".chip.active")].map(x=>x.dataset.value)});
function cols(d){return {grid_3x2:"repeat(3,1fr)",editorial_mosaic:"1.5fr .8fr 1fr",polaroid_stack:"repeat(3,1fr)",film_strip:"repeat(6,1fr)",large_pair:"repeat(2,1fr)",asymmetric_grid:"1.4fr .8fr"}[d.moment_layout]||"repeat(3,1fr)"}
function renderMoments(d){let a=(preview.moment_images||[]).slice(0,6);while(a.length<6)a.push("");return a.map(u=>u?`<img src="${esc(u)}">`:`<div class="ph"></div>`).join("")}

function mainPhoto(){return preview.hero_image_url||((preview.moment_images||[])[0])||""}
function familyPreview(t){
  const d=t.design||{}, family=d.family||"photo_frame", img=esc(mainPhoto());
  const names=`${esc(preview.groom_name||"GROOM")} & ${esc(preview.bride_name||"BRIDE")}`;
  const date=esc(preview.date_summary||"OUR WEDDING DAY");
  if(family==="doodle_wedding") return `<div class="v21-preview v21-doodle"><div class="hand">Save the date!</div><div class="poster">${img?`<img src="${img}">`:""}<div class="gb"><span>GROOM</span><span>BRIDE</span></div></div><div class="hand" style="font-size:15px;margin-top:16px">${names}</div></div>`;
  if(family==="kitsch_collage") return `<div class="v21-preview v21-kitsch">${img?`<img src="${img}">`:""}<div class="dots"><span>K</span><span>I</span><span>T</span></div><div class="heart"><div><strong>${names}</strong><br><span style="font-size:9px">${date}</span></div></div></div>`;
  if(family==="retro_romance") return `<div class="v21-preview v21-retro"><div class="script">Save the Date</div><div class="lace">${img?`<img src="${img}">`:""}</div><div class="small">${names}<br>${date}<br><span style="color:#e78aab">YOU'RE INVITED TO OUR WEDDING</span></div></div>`;
  if(family==="paper_poetry") return `<div class="v21-preview v21-paper"><div class="inv">INVITATION</div><div class="polaroid">${img?`<img src="${img}">`:""}</div><div class="poem"><strong>${names}</strong><br><br>좋은 친구 사이로 시작해<br>함께 내일을 만들어가려 합니다.</div></div>`;
  return `<div class="v21-preview v21-photo"><div class="film"><div class="shot">${img?`<img src="${img}">`:""}</div><div class="rail"><span>${date}</span><span>▲13A</span></div><div class="caption"><span style="font-size:8px;letter-spacing:.18em">SAVE THE DATE</span><strong>${names}</strong></div></div></div>`;
}
function render(){
  const w=$("themes");w.innerHTML="";
  themes.forEach((t,i)=>{
    const c=document.createElement("article");
    c.className="theme"+(i===sel?" selected":"");
    c.onclick=()=>{sel=i;render();$("bottom").style.display="block"};
    c.innerHTML=`<div class="phone-wrap">${familyPreview(t)}</div><div class="theme-info"><strong>${esc(t.name)}</strong><p>${esc(t.description)}</p><div class="preset">${esc((t.design.family||"photo_frame").replaceAll("_"," "))}</div></div>`;
    w.appendChild(c);
  });
}
$("generateBtn").onclick=async()=>{let p=$("prompt").value.trim();if(p.length<10){note("원하는 분위기를 조금 더 자세히 적어주세요.","error");return}let b=$("generateBtn");b.disabled=true;b.textContent="AI가 세 가지 방향을 디자인 중...";try{let d=await call("generate",{prompt:p,moods,colors:$("colors").value.trim()});themes=d.themes||[];sel=-1;render();$("bottom").style.display="none";$("usage").textContent=`AI 생성권 ${d.used} / ${d.max}회 사용`;note("같은 콘텐츠로 서로 다른 세 가지 디자인을 만들었습니다.")}catch(e){note(e.message,"error")}finally{b.disabled=false;b.textContent="✨ 우리 취향으로 디자인하기"}};
$("refineBtn").onclick=async()=>{if(sel<0)return;let q=$("refineInput").value.trim();if(q.length<2){note("어떻게 바꾸고 싶은지 짧게 적어주세요.","error");return}let b=$("refineBtn");b.disabled=true;b.textContent="조정 중...";try{let d=await call("refine",{request:q,current:themes[sel]});themes[sel]=d.theme;render();$("usage").textContent=`AI 생성권 ${d.used} / ${d.max}회 사용`;note("선택한 시안을 기준으로 미세조정했습니다.")}catch(e){note(e.message,"error")}finally{b.disabled=false;b.textContent="AI로 미세조정"}};
$("applyBtn").onclick=async()=>{if(sel<0)return;let b=$("applyBtn");b.disabled=true;b.textContent="적용 중...";try{await call("apply",{design:themes[sel].design});note("디자인을 적용했습니다. 실제 청첩장을 확인해보세요.");if(slug&&!document.getElementById("view")){let a=document.createElement("a");a.id="view";a.className="btn";a.target="_blank";a.href="https://6athome.github.io/Wedding/?slug="+encodeURIComponent(slug);a.textContent="청첩장 확인하기";$("bottom").insertBefore(a,$("bottom").children[1])}}catch(e){note(e.message,"error")}finally{b.disabled=false;b.textContent="이 디자인 적용하기"}};
(async()=>{if(!token){$("loading").textContent="유효한 디자인 링크가 아닙니다.";return}try{let d=await call("session");slug=d.slug;preview=d.preview||{};$("usage").textContent=`AI 생성권 ${d.used} / ${d.max}회 사용`;$("loading").style.display="none";$("app").style.display="block"}catch(e){$("loading").textContent=e.message}})();
</script></body></html>
