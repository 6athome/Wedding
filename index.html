<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<title>초대합니다</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@300;400&display=swap');
*{box-sizing:border-box}
:root{--bg:#f3eee3;--accent:#6f251d;--ink:#211c18;--muted:#7f746b;--card:#fffdf9;--line:rgba(40,30,25,.14);--serif:"Cormorant Garamond","Noto Serif KR",serif;--sans:"Noto Sans KR",sans-serif}
html{scroll-behavior:smooth}body{margin:0;background:#e9e5df;color:var(--ink);font-family:var(--sans);font-weight:300}
#app{width:min(100%,480px);margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.08)}
.loading{padding:100px 24px;text-align:center;color:var(--muted)}
section{position:relative}
img{display:block;width:100%}
.kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.serif{font-family:var(--serif)}
.copy{font-size:13px;line-height:2;white-space:pre-line}
.rule{width:34px;height:1px;background:var(--accent);margin:24px auto}
.section-pad{padding:68px 28px}
.center{text-align:center}
.muted{color:var(--muted)}
.section-title{font:400 25px/1 var(--serif);letter-spacing:.05em;margin:0 0 30px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);border:1px solid currentColor;background:transparent;padding:12px 17px;font-size:11px;letter-spacing:.08em;min-height:42px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.two-btn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hidden{display:none!important}

/* Hero A */
.qe-hero{position:relative;background:#161412;color:white}
.qe-hero img{height:78svh;min-height:570px;object-fit:cover}
.photo-warm{filter:saturate(.85) sepia(.08)}
.photo-soft{filter:saturate(.78) contrast(.96)}
.photo-bw{filter:grayscale(1)}
.photo-muted{filter:saturate(.65)}
.qe-save{position:absolute;top:34px;left:28px;font:400 12px/1.45 var(--serif);letter-spacing:.18em}
.qe-overlay{position:absolute;inset:auto 0 0;padding:100px 28px 34px;background:linear-gradient(transparent,rgba(0,0,0,.58))}
.qe-names{font:400 40px/.98 var(--serif);letter-spacing:-.02em}
.qe-date{margin-top:16px;font-size:10px;letter-spacing:.13em}
.qe-intro{padding:70px 36px;text-align:center}

/* Hero B */
.ti-hero{padding:44px 28px 36px;min-height:660px}
.ti-top{display:flex;justify-content:space-between;align-items:flex-start;font:400 11px/1.25 var(--serif);letter-spacing:.16em;color:var(--accent)}
.ti-name{font:400 clamp(60px,19vw,92px)/.82 var(--serif);letter-spacing:-.055em;margin-top:60px}
.ti-amp{font:italic 42px/1 var(--serif);color:var(--accent);margin:15px 0}
.ti-photo{margin-top:42px}
.ti-photo img{aspect-ratio:4/5;object-fit:cover;filter:grayscale(1)}
.ti-script{text-align:right;font:italic 25px/1.1 var(--serif);color:var(--accent);margin-top:25px}

/* Hero C */
.lp-letter{min-height:630px;background:color-mix(in srgb,var(--bg) 82%,white);position:relative;overflow:hidden}
.lp-flap{height:330px;background:color-mix(in srgb,var(--bg) 68%,white);clip-path:polygon(0 0,100% 0,50% 100%)}
.lp-card{position:absolute;z-index:2;left:10%;right:10%;top:100px;background:#fffdf8;padding:65px 22px;text-align:center;box-shadow:0 10px 30px rgba(45,35,28,.08);transform:rotate(-.8deg)}
.lp-card h1{font:italic 43px/1.02 var(--serif);margin:0 0 28px}
.lp-card .names{font:400 13px var(--serif);letter-spacing:.12em}
.lp-card .date{font-size:9px;letter-spacing:.13em;color:var(--accent);margin-top:11px}
.star{position:absolute;color:var(--accent);font-size:16px;opacity:.6}
.lp-copy{padding:60px 34px;text-align:center}
.lp-book{padding:58px 25px 70px;background:color-mix(in srgb,var(--accent) 22%,var(--bg))}
.lp-shot{background:#fff;padding:8px 8px 28px;margin-bottom:24px;box-shadow:0 7px 18px rgba(40,35,30,.12)}
.lp-shot:nth-child(odd){transform:rotate(-1.2deg)}.lp-shot:nth-child(even){transform:rotate(1.2deg)}
.lp-shot img{aspect-ratio:3/2;object-fit:cover}
.lp-note{text-align:right;font:italic 23px var(--serif);margin-top:28px}

/* Moments */
.moments{padding:70px 18px}
.m-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.m-grid img{aspect-ratio:1;object-fit:cover}
.tpl-quiet_editorial .m-grid img:first-child{grid-column:span 2;aspect-ratio:16/10}
.tpl-type_image .moments{background:var(--card)}
.tpl-type_image .m-grid{grid-template-columns:1.35fr .65fr}
.tpl-type_image .m-grid img:nth-child(3n+1){grid-row:span 2;height:100%}
.tpl-letter_photobook .moments{display:none}

/* Wedding day */
.day{padding:70px 28px;text-align:center;border-top:1px solid var(--line)}
.big-date{font:400 64px/.85 var(--serif);color:var(--accent)}
.day-sub{margin-top:9px;font-size:11px;letter-spacing:.2em}
.day-meta{display:grid;grid-template-columns:1fr 1fr;margin-top:34px}
.day-meta>div{padding:10px;border-left:1px solid var(--line)}
.day-meta>div:first-child{border-left:0}
.day-meta b{display:block;font-size:12px;font-weight:400;margin-top:6px}

/* Location */
.location{padding:68px 22px;border-top:1px solid var(--line)}
.map{margin:25px 0 18px;background:#eee;overflow:hidden}
.map img{aspect-ratio:16/9;object-fit:cover}
.location-copy{font-size:12px;line-height:1.9;text-align:center}
.parking{margin-top:28px;padding:22px;background:color-mix(in srgb,var(--accent) 7%,white);font-size:11px;line-height:1.8}

/* RSVP */
.rsvp{padding:66px 28px;text-align:center;border-top:1px solid var(--line)}
.rsvp p{font-size:12px;line-height:1.8}

/* Accounts */
.accounts{padding:68px 18px;border-top:1px solid var(--line)}
.accounts-intro{text-align:center;font-size:12px;line-height:1.9;margin-bottom:26px}
.acc-group{margin-bottom:10px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:color-mix(in srgb,var(--accent) 6%,white)}
.acc-head{width:100%;border:0;background:transparent;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;font:inherit;color:inherit;cursor:pointer}
.acc-head b{font-size:12px;font-weight:500}.acc-head span{font-size:17px;transition:.2s}
.acc-group.open .acc-head span{transform:rotate(180deg)}
.acc-body{display:none;padding:0 10px 10px}.acc-group.open .acc-body{display:block}
.acc-card{background:white;border-radius:11px;padding:14px;margin-top:8px}
.acc-top{display:flex;justify-content:space-between;gap:10px;font-size:10px;margin-bottom:12px}
.acc-box{background:#f5f3f2;border-radius:8px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.acc-bank{font-size:9px;color:var(--muted)}.acc-number{font-size:11px;margin-top:3px;letter-spacing:.04em}
.copy-btn{border:0;background:none;font:inherit;font-size:10px;cursor:pointer;color:var(--ink);padding:8px}

/* Contact */
.contact{padding:58px 24px;text-align:center;border-top:1px solid var(--line)}
.contact-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.contact a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;padding:7px 3px;font-size:11px}

/* Ending */
.ending{padding:80px 28px 95px;text-align:center}
.tpl-type_image .ending{background:var(--accent);color:#fff}
.tpl-letter_photobook .ending{background:color-mix(in srgb,var(--accent) 20%,var(--bg))}
.end-script{font:italic 31px var(--serif);margin-bottom:18px}
.error{padding:80px 24px;text-align:center;color:#7c2a22}
@media(min-width:481px){body{padding:24px 0}}
</style>
</head>
<body>
<div id="app"><div class="loading">청첩장을 준비하고 있습니다...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://gfpdjxdoxjonramxrlgi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_NUhd1LmMj09rtA5RMcgAxA_cMKIuZB6";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const app=document.getElementById("app");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const lines=v=>esc(v||"").replace(/\n/g,"<br>");
const validHex=(v,f)=>/^#[0-9A-Fa-f]{6}$/.test(String(v||""))?v:f;

function textInk(bg){return bg.toLowerCase()==="#181818"?"#f6efe7":"#211c18"}
function photoClass(tone){return {"warm":"photo-warm","soft":"photo-soft","bw":"photo-bw","muted":"photo-muted"}[tone]||""}
function navButtons(d){
 const out=[];
 if(d.naver_map_url)out.push(`<a class="btn" href="${esc(d.naver_map_url)}" target="_blank">네이버 지도</a>`);
 if(d.kakao_map_url)out.push(`<a class="btn" href="${esc(d.kakao_map_url)}" target="_blank">카카오맵</a>`);
 return out.join("");
}
function infoSection(d){
 return `<section class="day">
   <div class="kicker">WEDDING DAY</div>
   <div class="big-date">${esc((d.date_summary||"").match(/\d{1,2}[./월 ]+\d{1,2}/)?.[0]||"10.25")}</div>
   <div class="day-sub">${esc(d.date_detail||"")}</div>
   <div class="day-meta">
    <div><div class="kicker">TIME</div><b>${esc(d.time_detail||"")}</b></div>
    <div><div class="kicker">PLACE</div><b>${esc(d.venue_name||"")}</b></div>
   </div>
 </section>`;
}
function locationSection(d){
 if(!d.location_address&&!d.map_image_url&&!d.venue_name)return "";
 return `<section class="location">
  <h2 class="section-title">LOCATION</h2>
  <div class="location-copy"><b>${esc(d.venue_name||"")}</b><br>${esc(d.location_address||"")}<br>${esc(d.location_detail_1||"")}<br>${esc(d.location_detail_2||"")}</div>
  ${d.map_image_url?`<div class="map"><img src="${esc(d.map_image_url)}" alt="약도"></div>`:""}
  <div class="two-btn">${navButtons(d)}</div>
  ${(d.parking_line_1||d.parking_line_2||d.parking_detail)?`<div class="parking"><div class="kicker" style="margin-bottom:8px">PARKING</div>${esc(d.parking_line_1||"")}<br>${esc(d.parking_line_2||"")}<br><br>${lines(d.parking_detail||"")}</div>`:""}
 </section>`;
}
function rsvpSection(d){
 if(!d.rsvp_url)return "";
 return `<section class="rsvp"><h2 class="section-title">RSVP</h2><p>참석 여부를 알려주세요.</p><a class="btn accent" href="${esc(d.rsvp_url)}" target="_blank">참석여부 전달하기</a></section>`;
}
function normalizeAccounts(v){
 if(!v||typeof v!=="object")return {groom:[],bride:[]};
 return {groom:Array.isArray(v.groom)?v.groom:[],bride:Array.isArray(v.bride)?v.bride:[]};
}
function accountCard(a){
 if(!a||(!a.name&&!a.bank&&!a.number))return "";
 return `<div class="acc-card"><div class="acc-top"><span>${esc(a.label||"")}</span><span>${esc(a.name||"")}</span></div>
 <div class="acc-box"><div><div class="acc-bank">${esc(a.bank||"")}</div><div class="acc-number">${esc(a.number||"")}</div></div>
 <button class="copy-btn" data-copy="${esc(a.number||"")}">복사</button></div></div>`;
}
function accountGroup(title,rows){
 if(!rows.length)return "";
 return `<div class="acc-group"><button class="acc-head" type="button"><b>${title}</b><span>⌄</span></button><div class="acc-body">${rows.map(accountCard).join("")}</div></div>`;
}
function accountsSection(d){
 const a=normalizeAccounts(d.wedding_accounts);
 if(!a.groom.length&&!a.bride.length)return "";
 return `<section class="accounts"><h2 class="section-title">마음 전하실 곳</h2><div class="accounts-intro">참석이 어려우신 분들을 위해 기재했습니다.<br>너그러운 마음으로 양해 부탁드립니다.</div>${accountGroup("신랑측에게",a.groom)}${accountGroup("신부측에게",a.bride)}</section>`;
}
function contactSection(d){
 const rows=[];
 if(d.groom_phone)rows.push(`<a href="tel:${esc(d.groom_phone)}">신랑 · ${esc(d.groom_phone)}</a>`);
 if(d.bride_phone)rows.push(`<a href="tel:${esc(d.bride_phone)}">신부 · ${esc(d.bride_phone)}</a>`);
 if(!rows.length)return "";
 return `<section class="contact"><h2 class="section-title">CONTACT</h2><div class="contact-row">${rows.join("")}</div></section>`;
}
function momentsImages(d){
 return (Array.isArray(d.moment_images)?d.moment_images:[]).filter(Boolean).slice(0,6);
}
function momentsSection(d){
 const imgs=momentsImages(d);if(!imgs.length)return "";
 return `<section class="moments"><h2 class="section-title">OUR MOMENTS</h2><div class="m-grid">${imgs.map(x=>`<img src="${esc(x)}" alt="">`).join("")}</div></section>`;
}
function sharedTail(d){
 return infoSection(d)+locationSection(d)+rsvpSection(d)+accountsSection(d)+contactSection(d);
}
function invitationCopy(d){
 return [d.intro_line,d.invite_message_1,d.invite_message_2,d.invite_message_3].filter(Boolean).join("\n\n");
}
function renderQuiet(d,cfg){
 const hero=d.hero_image_url||momentsImages(d)[0]||"";
 return `<main class="tpl-quiet_editorial" style="--bg:${cfg.bg};--accent:${cfg.accent};--ink:${cfg.ink};--card:${cfg.card}">
 <section class="qe-hero">${hero?`<img class="${photoClass(cfg.tone)}" src="${esc(hero)}" alt="">`:""}
 <div class="qe-save">WE'RE<br>GETTING<br>MARRIED</div><div class="qe-overlay"><div class="qe-names">${esc(d.groom_name||"GROOM")}<br>&<br>${esc(d.bride_name||"BRIDE")}</div><div class="qe-date">${esc(d.date_summary||"")}</div></div></section>
 <section class="qe-intro"><div class="copy">${lines(invitationCopy(d))}</div><div class="rule"></div></section>
 ${momentsSection(d)}${sharedTail(d)}
 <section class="ending"><div class="end-script">with all our love</div><div class="copy">따뜻한 마음으로<br>함께해 주셔서 감사합니다.</div></section></main>`;
}
function renderType(d,cfg){
 const hero=d.hero_image_url||momentsImages(d)[0]||"";
 return `<main class="tpl-type_image" style="--bg:${cfg.bg};--accent:${cfg.accent};--ink:${cfg.ink};--card:${cfg.card}">
 <section class="ti-hero"><div class="ti-top"><span>WE'RE<br>GETTING<br>MARRIED</span><span>${esc(d.date_summary||"")}</span></div>
 <div class="ti-name">${esc(d.groom_name||"GROOM")}</div><div class="ti-amp">&</div><div class="ti-name">${esc(d.bride_name||"BRIDE")}</div>
 ${hero?`<div class="ti-photo"><img src="${esc(hero)}" alt=""></div>`:""}<div class="ti-script">we are getting married</div></section>
 <section class="section-pad center" style="background:var(--accent);color:#fff"><div class="copy">${lines(invitationCopy(d))}</div></section>
 ${momentsSection(d)}${sharedTail(d)}
 <section class="ending"><div class="end-script">Thank you</div><div class="copy">따뜻한 마음으로 함께해 주셔서 감사합니다.</div></section></main>`;
}
function renderLetter(d,cfg){
 const imgs=momentsImages(d);
 const shots=(imgs.length?imgs:[d.hero_image_url]).filter(Boolean).map(x=>`<div class="lp-shot"><img class="${photoClass(cfg.tone)}" src="${esc(x)}" alt=""></div>`).join("");
 return `<main class="tpl-letter_photobook" style="--bg:${cfg.bg};--accent:${cfg.accent};--ink:${cfg.ink};--card:${cfg.card}">
 <section class="lp-letter"><div class="lp-flap"></div>
 <span class="star" style="left:12%;top:90px">✦</span><span class="star" style="right:14%;top:160px">✧</span>
 <div class="lp-card"><h1>You're invited</h1><div class="names">${esc(d.groom_name||"GROOM")} & ${esc(d.bride_name||"BRIDE")}</div><div class="date">${esc(d.date_summary||"")}</div></div></section>
 <section class="lp-copy"><div class="copy">${lines(invitationCopy(d))}</div></section>
 ${shots?`<section class="lp-book"><div class="kicker center" style="margin-bottom:30px;color:#fff">OUR MOMENTS</div>${shots}<div class="lp-note">with all our love ♡</div></section>`:""}
 ${sharedTail(d)}
 <section class="ending"><div class="end-script">with all our love ♡</div></section></main>`;
}
function bindInteractions(){
 document.querySelectorAll(".acc-head").forEach(btn=>btn.addEventListener("click",()=>btn.parentElement.classList.toggle("open")));
 document.querySelectorAll("[data-copy]").forEach(btn=>btn.addEventListener("click",async()=>{
   const val=btn.dataset.copy||""; if(!val)return;
   try{await navigator.clipboard.writeText(val);btn.textContent="복사됨";setTimeout(()=>btn.textContent="복사",1200)}catch(_){prompt("계좌번호를 복사해 주세요.",val)}
 }));
}
async function load(){
 const slug=(new URLSearchParams(location.search).get("slug")||"jisoo").trim().toLowerCase();
 try{
  const {data,error}=await db.from("weddings").select("*").eq("slug",slug).eq("is_published",true).single();
  if(error)throw error;
  document.title=data.page_title||"초대합니다";
  const dc=data.design_config||{};
  const bg=validHex(dc.background_hex,"#F3EEE3"),accent=validHex(dc.accent_hex,"#6F251D");
  const cfg={bg,accent,ink:textInk(bg),card:bg.toLowerCase()==="#181818"?"#272321":"#fffdf9",tone:dc.photo_tone||"natural"};
  const tpl=dc.template||"quiet_editorial";
  app.style.setProperty("--bg",bg);app.style.setProperty("--accent",accent);app.style.setProperty("--ink",cfg.ink);
  app.innerHTML=tpl==="type_image"?renderType(data,cfg):tpl==="letter_photobook"?renderLetter(data,cfg):renderQuiet(data,cfg);
  app.style.background=bg;app.style.color=cfg.ink;
  bindInteractions();
 }catch(e){console.error(e);app.innerHTML='<div class="error">청첩장을 불러오지 못했습니다.<br>URL 또는 공개 상태를 확인해 주세요.</div>'}
}
load();
</script>
</body>
</html>
