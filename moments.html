/* ===== AI DESIGN SYSTEM V2 ===== */
:root{
  --ai-heading-font:"Playfair Display",Georgia,serif;
  --ai-body-font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  --ai-heading-scale:1;
  --ai-letter-spacing:0em;
  --ai-section-spacing:1;
  --ai-radius:6px;
  --ai-photo-radius:6px;
}
body{font-family:var(--ai-body-font)}
body.ai-v2 h1,body.ai-v2 h2,body.ai-v2 h3{font-family:var(--ai-heading-font)}

body.ai-v2 .hero-illustration{aspect-ratio:var(--ai-hero-ratio,16/10);max-height:none}

body.ai-title-left .hero,body.ai-title-left .label{text-align:left!important}
body.ai-title-center .hero,body.ai-title-center .label{text-align:center!important}
body.ai-title-right .hero,body.ai-title-right .label{text-align:right!important}
body.ai-button-pill .rsvp a,body.ai-button-pill .map-buttons a{border-radius:999px}

  function applyDesignConfig(config) {
    if (!config || typeof config !== "object") return;
    const root = document.documentElement;
    const colorMap = {
      background: "--bg",
      background_alt: "--bg-alt",
      foreground: "--fg",
      muted: "--muted",
      accent: "--accent",
      card_background: "--card-bg",
      card_text: "--card-text"
    };
    Object.entries(colorMap).forEach(([key, cssVar]) => {
      if (config[key]) root.style.setProperty(cssVar, config[key]);
    });

    const fontMap = {
      playfair: '"Playfair Display", Georgia, serif',
      cormorant: '"Cormorant Garamond", Georgia, serif',
      myeongjo: '"Nanum Myeongjo", "Noto Serif KR", Georgia, serif',
      noto_sans: '"Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif'
    };
    root.style.setProperty("--ai-heading-font", fontMap[config.heading_font] || fontMap.playfair);
    root.style.setProperty("--ai-body-font", fontMap[config.body_font] || fontMap.noto_sans);

    const radiusMap = { none: "0px", small: "6px", medium: "14px", large: "24px" };
    root.style.setProperty("--ai-radius", radiusMap[config.border_radius] || "6px");
    root.style.setProperty("--ai-photo-radius", radiusMap[config.border_radius] || "6px");

    document.body.classList.remove(
      "ai-theme-minimal","ai-theme-editorial","ai-theme-romantic","ai-theme-playful",
      "ai-photo-square","ai-photo-rounded","ai-photo-polaroid","ai-photo-full",
      "ai-animation-none","ai-animation-subtle","ai-animation-soft","ai-animation-playful"
    );
    document.body.classList.add("ai-theme-" + (config.layout || "editorial"));
    document.body.classList.add("ai-photo-" + (config.photo_style || "square"));
    document.body.classList.add("ai-animation-" + (config.animation || "soft"));
  }



function applyDesignSystemV2(config){
  if(!config||typeof config!=="object")return;
  const root=document.documentElement,body=document.body;
  const map={background:"--bg",background_alt:"--bg-alt",foreground:"--fg",muted:"--muted",accent:"--accent",card_background:"--card-bg",card_text:"--card-text"};
  Object.entries(map).forEach(([k,v])=>{if(config[k])root.style.setProperty(v,config[k])});
  const fonts={
    playfair:'"Playfair Display",Georgia,serif',
    cormorant:'"Cormorant Garamond",Georgia,serif',
    myeongjo:'"Nanum Myeongjo","Noto Serif KR",Georgia,serif',
    noto_sans:'"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif'
  };
  root.style.setProperty("--ai-heading-font",fonts[config.heading_font]||fonts.playfair);
  root.style.setProperty("--ai-body-font",fonts[config.body_font]||fonts.noto_sans);
  root.style.setProperty("--ai-heading-scale",String(config.heading_scale||1));
  root.style.setProperty("--ai-letter-spacing",String(config.letter_spacing||0)+"em");
  root.style.setProperty("--ai-section-spacing",String(config.section_spacing||1));
  const ratios={portrait:"4 / 5",landscape:"3 / 2",square:"1 / 1",cinematic:"16 / 7"};
  root.style.setProperty("--ai-hero-ratio",ratios[config.hero_ratio]||"16 / 10");
  root.style.setProperty("--ai-hero-fit",config.hero_fit||"cover");
  [...body.classList].filter(x=>x.startsWith("ai-")).forEach(x=>body.classList.remove(x));
  body.classList.add("ai-v2");
  body.classList.add("ai-preset-"+(config.preset||"bordeaux_editorial"));
  body.classList.add("ai-title-"+(config.title_alignment||"center"));
  body.classList.add("ai-button-"+(config.button_style||"outline"));
  body.classList.add("ai-card-"+(config.card_style||"flat"));
  body.classList.add("ai-decoration-"+(config.decoration||"none"));
  body.dataset.momentLayout=config.moment_layout||"grid_3x2";
}



function applyFamilyClassV21(config){
  if(!config)return;
  [...document.body.classList].filter(c=>c.startsWith("family-")).forEach(c=>document.body.classList.remove(c));
  document.body.classList.add("family-"+(config.family||"photo_frame"));
}

async function loadGallery(){
  const {data,error}=await sdb.from("weddings").select("moment_images,design_config").eq("slug",slug).eq("is_published",true).single();
  if(error){ document.getElementById("loadError").style.display="block"; document.getElementById("loadError").textContent="갤러리를 불러오지 못했습니다."; return; }
  applyDesignSystemV2(data.design_config);
  applyFamilyClassV21(data.design_config);
  const images=Array.isArray(data.moment_images)?data.moment_images.slice(0,6):[];
  const gallery=document.getElementById("gallery");
  gallery.innerHTML="";
  for(let i=0;i<6;i++){
    const fig=document.createElement("figure");
    fig.className="gallery-item";
    fig.dataset.momentId="moment"+(i+1);
    const frame=document.createElement("div");
    frame.className="photo-frame";
    if(images[i]){
      const img=document.createElement("img");
      img.src=images[i]; img.alt="";
      frame.appendChild(img);
      fig.addEventListener("click",()=>openModal(`${slug}-moment${i+1}`,images[i]));
    } else {
      frame.textContent="Photo "+(i+1);
    }
    fig.appendChild(frame); gallery.appendChild(fig);
  }
}
loadGallery();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

const firebaseConfig={
  apiKey:"AIzaSyC1LUBjRLfHXyN22l5wfqWZWH40MO73Uro",

  projectId:"weddingparty-3fcd4",
  storageBucket:"weddingparty-3fcd4.firebasestorage.app",
  messagingSenderId:"642711237403",
  appId:"1:642711237403:web:0ec6705597e4eef8b459be",
  measurementId:"G-L402LR3VRV"
};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
const modal=document.getElementById("comment-modal");
const closeBtn=modal.querySelector(".comment-modal-close");
const photoImg=document.getElementById("comment-photo-img");
const commentList=document.getElementById("comment-list");
const form=document.getElementById("comment-form");
const nameInput=document.getElementById("comment-name");
const messageInput=document.getElementById("comment-message");
const submitBtn=document.getElementById("comment-submit");
let currentMomentId=null,unsubscribe=null;

window.openModal=function(momentId,imgSrc){
  currentMomentId=momentId; photoImg.src=imgSrc; modal.classList.add("active"); document.body.style.overflow="hidden"; loadComments(momentId);
}
function closeModal(){ modal.classList.remove("active"); document.body.style.overflow=""; if(unsubscribe){unsubscribe();unsubscribe=null;} }
closeBtn.addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("active"))closeModal();});

function loadComments(momentId){
  commentList.innerHTML='<p class="loading">불러오는 중...</p>';
  const q=query(collection(db,"comments"),where("momentId","==",momentId),orderBy("timestamp","desc"));
  unsubscribe=onSnapshot(q,snapshot=>{
    if(snapshot.empty){commentList.innerHTML='<p class="empty">첫 메시지를 남겨보세요</p>';return;}
    commentList.innerHTML="";
    snapshot.forEach(doc=>{
      const d=doc.data(); const item=document.createElement("div"); item.className="comment-item";
      const n=document.createElement("div"); n.className="comment-name"; n.textContent=d.name||"익명";
      const m=document.createElement("div"); m.className="comment-message"; m.textContent=d.message||"";
      item.append(n,m); commentList.appendChild(item);
    });
  },()=>{commentList.innerHTML='<p class="empty">불러오기 실패</p>';});
}
form.addEventListener("submit",async e=>{
  e.preventDefault(); const name=nameInput.value.trim(),message=messageInput.value.trim(); if(!name||!message||!currentMomentId)return;
  submitBtn.disabled=true; submitBtn.textContent="전송 중...";
  try{await addDoc(collection(db,"comments"),{momentId:currentMomentId,name,message,timestamp:serverTimestamp()});nameInput.value="";messageInput.value="";}
  catch(e){alert("메시지 전송 실패. 잠시 후 다시 시도해주세요.");}
  finally{submitBtn.disabled=false;submitBtn.textContent="남기기";}
});
</script>
