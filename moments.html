<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moments</title>
<style>
  :root { --bg:#FFF6EA; --fg:#2a2a28; --muted:#9a938a; --line:#e8ddc8; --accent:#2d4a2b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; overflow-x:hidden; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; background:var(--bg); color:var(--fg); line-height:1.7; font-weight:300; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  nav.topnav { position:sticky; top:0; background:rgba(255,246,234,.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); box-shadow:0 2px 12px rgba(0,0,0,.04); z-index:100; }
  nav.topnav ul { max-width:1080px; margin:0 auto; padding:20px 32px; display:flex; justify-content:center; gap:40px; list-style:none; }
  nav.topnav a { position:relative; color:var(--fg); text-decoration:none; font-size:15px; font-weight:500; letter-spacing:.15em; text-transform:uppercase; padding:4px 0; }
  nav.topnav a.active { color:var(--accent); }
  .container { max-width:1080px; margin:0 auto; padding:60px 32px 100px; }
  .gallery { display:grid; grid-template-columns:repeat(3,1fr); gap:40px 30px; padding:20px 0; }
  .gallery-item { background:white; padding:14px 14px 58px; box-shadow:0 6px 18px rgba(0,0,0,.10); display:flex; flex-direction:column; cursor:pointer; transition:transform .3s ease,box-shadow .3s ease; }
  .gallery-item:nth-child(3n+1){transform:rotate(-2deg)} .gallery-item:nth-child(3n+2){transform:rotate(1.2deg)} .gallery-item:nth-child(3n+3){transform:rotate(-.8deg)}
  .gallery-item:hover { transform:translateY(-6px) rotate(0); box-shadow:0 12px 28px rgba(0,0,0,.14); z-index:2; }
  .photo-frame { aspect-ratio:1; background:linear-gradient(135deg,#ede8de,#dfd8c9); overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  .photo-frame img { width:100%; height:100%; object-fit:cover; display:block; }
  .back-home { text-align:center; margin-top:80px; padding-top:40px; border-top:1px solid var(--line); }
  .back-home a { color:var(--muted); text-decoration:none; font-size:13px; letter-spacing:.15em; text-transform:uppercase; }
  .load-error { display:none; text-align:center; padding:30px; color:#9b2c2c; }
  .comment-modal { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:2000; display:none; align-items:center; justify-content:center; padding:20px; }
  .comment-modal.active { display:flex; }
  .comment-modal-content { background:white; width:min(94vw,480px); max-height:90vh; overflow-y:auto; padding:28px 24px 24px; border-radius:8px; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .comment-modal-close { position:absolute; top:10px; right:14px; background:none; border:none; font-size:28px; cursor:pointer; color:#888; }
  .comment-photo { width:100%; aspect-ratio:1; overflow:hidden; border-radius:4px; margin-bottom:20px; background:#f5f5f5; }
  .comment-photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .comment-list { margin-bottom:20px; max-height:200px; overflow-y:auto; border-top:1px solid #eee; border-bottom:1px solid #eee; padding:8px 4px; }
  .comment-list .empty,.comment-list .loading { color:#999; text-align:center; font-size:13px; padding:20px 0; }
  .comment-item { padding:10px 4px; border-bottom:1px dashed #eee; }
  .comment-name { font-size:12px; color:#888; font-weight:500; margin-bottom:4px; }
  .comment-message { font-size:14px; color:#333; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .comment-form { display:flex; flex-direction:column; gap:10px; }
  .comment-form input,.comment-form textarea { border:1px solid #ddd; padding:10px 12px; font-size:14px; font-family:inherit; border-radius:4px; outline:none; background:white; }
  .comment-form textarea { min-height:70px; resize:vertical; }
  .comment-form button { background:#333; color:white; border:none; padding:12px; font-size:13px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; border-radius:4px; }
  @media(max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){nav.topnav ul{gap:22px;padding:16px} nav.topnav a{font-size:13px;letter-spacing:.1em}.container{padding:40px 20px 80px}.gallery{grid-template-columns:1fr 1fr;gap:24px 16px}.gallery-item{padding:10px 10px 42px}}

  /* AI design tokens */
  :root {
    --ai-heading-font: Georgia, "Times New Roman", serif;
    --ai-body-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    --ai-radius: 6px;
    --ai-photo-radius: 6px;
  }
  body { font-family: var(--ai-body-font); }
  body.ai-theme-editorial h1, body.ai-theme-editorial h2, body.ai-theme-editorial h3,
  body.ai-theme-romantic h1, body.ai-theme-romantic h2, body.ai-theme-romantic h3 {
    font-family: var(--ai-heading-font);
  }
  body.ai-photo-rounded img { border-radius: var(--ai-photo-radius); }
  body.ai-photo-polaroid .photo-frame { padding: 8px; background: #fff; }
  body.ai-photo-polaroid .photo-frame img { border-radius: 2px; }
  body.ai-animation-none *, body.ai-animation-none *::before, body.ai-animation-none *::after {
    transition-duration: 0s !important;
    animation-duration: 0s !important;
  }

</style>
</head>
<body>
<nav class="topnav"><ul>
  <li><a id="navAbout" href="index.html#about">About</a></li>
  <li><a id="navMoments" href="moments.html" class="active">Moments</a></li>
  <li><a id="navLocation" href="location.html">Location</a></li>
  <li><a id="navInvite" href="index.html#invitation">Invite</a></li>
</ul></nav>

<div class="container">
  <div id="loadError" class="load-error"></div>
  <div class="gallery" id="gallery"></div>
  <div class="back-home"><a id="backHome" href="index.html">← 메인으로 돌아가기</a></div>
</div>

<div id="comment-modal" class="comment-modal" role="dialog" aria-modal="true">
  <div class="comment-modal-content">
    <button class="comment-modal-close" aria-label="닫기">×</button>
    <div class="comment-photo"><img id="comment-photo-img" src="" alt=""></div>
    <div class="comment-list" id="comment-list"><p class="empty">첫 메시지를 남겨보세요</p></div>
    <form class="comment-form" id="comment-form">
      <input type="text" id="comment-name" placeholder="이름" required maxlength="20" autocomplete="off">
      <textarea id="comment-message" placeholder="메시지를 남겨주세요 :)" required maxlength="500"></textarea>
      <button type="submit" id="comment-submit">남기기</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://gfpdjxdoxjonramxrlgi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_NUhd1LmMj09rtA5RMcgAxA_cMKIuZB6";
const sdb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const params=new URLSearchParams(location.search);
const slug=(params.get("slug")||"jisoo").trim().toLowerCase();

function withSlug(path,hash=""){ return path+"?slug="+encodeURIComponent(slug)+hash; }
document.getElementById("navAbout").href=withSlug("index.html","#about");
document.getElementById("navMoments").href=withSlug("moments.html");
document.getElementById("navLocation").href=withSlug("location.html");
document.getElementById("navInvite").href=withSlug("index.html","#invitation");
document.getElementById("backHome").href=withSlug("index.html");


  function applyDesignConfig(config) {
    if (!config || typeof config !== "object") return;
    const root = document.documentElement;
    const colorMap = {
      background: "--bg",
      background_alt: "--bg-alt",
      foreground: "--fg",
      muted: "--muted",
      accent: "--accent",
      card_background: "--card-bg",
      card_text: "--card-text"
    };
    Object.entries(colorMap).forEach(([key, cssVar]) => {
      if (config[key]) root.style.setProperty(cssVar, config[key]);
    });

    const fontMap = {
      playfair: '"Playfair Display", Georgia, serif',
      cormorant: '"Cormorant Garamond", Georgia, serif',
      myeongjo: '"Nanum Myeongjo", "Noto Serif KR", Georgia, serif',
      noto_sans: '"Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif'
    };
    root.style.setProperty("--ai-heading-font", fontMap[config.heading_font] || fontMap.playfair);
    root.style.setProperty("--ai-body-font", fontMap[config.body_font] || fontMap.noto_sans);

    const radiusMap = { none: "0px", small: "6px", medium: "14px", large: "24px" };
    root.style.setProperty("--ai-radius", radiusMap[config.border_radius] || "6px");
    root.style.setProperty("--ai-photo-radius", radiusMap[config.border_radius] || "6px");

    document.body.classList.remove(
      "ai-theme-minimal","ai-theme-editorial","ai-theme-romantic","ai-theme-playful",
      "ai-photo-square","ai-photo-rounded","ai-photo-polaroid","ai-photo-full",
      "ai-animation-none","ai-animation-subtle","ai-animation-soft","ai-animation-playful"
    );
    document.body.classList.add("ai-theme-" + (config.layout || "editorial"));
    document.body.classList.add("ai-photo-" + (config.photo_style || "square"));
    document.body.classList.add("ai-animation-" + (config.animation || "soft"));
  }


async function loadGallery(){
  const {data,error}=await sdb.from("weddings").select("moment_images,design_config").eq("slug",slug).eq("is_published",true).single();
  if(error){ document.getElementById("loadError").style.display="block"; document.getElementById("loadError").textContent="갤러리를 불러오지 못했습니다."; return; }
  applyDesignConfig(data.design_config);
  const images=Array.isArray(data.moment_images)?data.moment_images.slice(0,6):[];
  const gallery=document.getElementById("gallery");
  gallery.innerHTML="";
  for(let i=0;i<6;i++){
    const fig=document.createElement("figure");
    fig.className="gallery-item";
    fig.dataset.momentId="moment"+(i+1);
    const frame=document.createElement("div");
    frame.className="photo-frame";
    if(images[i]){
      const img=document.createElement("img");
      img.src=images[i]; img.alt="";
      frame.appendChild(img);
      fig.addEventListener("click",()=>openModal(`${slug}-moment${i+1}`,images[i]));
    } else {
      frame.textContent="Photo "+(i+1);
    }
    fig.appendChild(frame); gallery.appendChild(fig);
  }
}
loadGallery();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore,collection,addDoc,query,where,orderBy,onSnapshot,serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyC1LUBjRLfHXyN22l5wfqWZWH40MO73Uro",
  authDomain:"weddingparty-3fcd4.firebaseapp.com",
  projectId:"weddingparty-3fcd4",
  storageBucket:"weddingparty-3fcd4.firebasestorage.app",
  messagingSenderId:"642711237403",
  appId:"1:642711237403:web:0ec6705597e4eef8b459be",
  measurementId:"G-L402LR3VRV"
};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
const modal=document.getElementById("comment-modal");
const closeBtn=modal.querySelector(".comment-modal-close");
const photoImg=document.getElementById("comment-photo-img");
const commentList=document.getElementById("comment-list");
const form=document.getElementById("comment-form");
const nameInput=document.getElementById("comment-name");
const messageInput=document.getElementById("comment-message");
const submitBtn=document.getElementById("comment-submit");
let currentMomentId=null,unsubscribe=null;

window.openModal=function(momentId,imgSrc){
  currentMomentId=momentId; photoImg.src=imgSrc; modal.classList.add("active"); document.body.style.overflow="hidden"; loadComments(momentId);
}
function closeModal(){ modal.classList.remove("active"); document.body.style.overflow=""; if(unsubscribe){unsubscribe();unsubscribe=null;} }
closeBtn.addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("active"))closeModal();});

function loadComments(momentId){
  commentList.innerHTML='<p class="loading">불러오는 중...</p>';
  const q=query(collection(db,"comments"),where("momentId","==",momentId),orderBy("timestamp","desc"));
  unsubscribe=onSnapshot(q,snapshot=>{
    if(snapshot.empty){commentList.innerHTML='<p class="empty">첫 메시지를 남겨보세요</p>';return;}
    commentList.innerHTML="";
    snapshot.forEach(doc=>{
      const d=doc.data(); const item=document.createElement("div"); item.className="comment-item";
      const n=document.createElement("div"); n.className="comment-name"; n.textContent=d.name||"익명";
      const m=document.createElement("div"); m.className="comment-message"; m.textContent=d.message||"";
      item.append(n,m); commentList.appendChild(item);
    });
  },()=>{commentList.innerHTML='<p class="empty">불러오기 실패</p>';});
}
form.addEventListener("submit",async e=>{
  e.preventDefault(); const name=nameInput.value.trim(),message=messageInput.value.trim(); if(!name||!message||!currentMomentId)return;
  submitBtn.disabled=true; submitBtn.textContent="전송 중...";
  try{await addDoc(collection(db,"comments"),{momentId:currentMomentId,name,message,timestamp:serverTimestamp()});nameInput.value="";messageInput.value="";}
  catch(e){alert("메시지 전송 실패. 잠시 후 다시 시도해주세요.");}
  finally{submitBtn.disabled=false;submitBtn.textContent="남기기";}
});
</script>
</body>
</html>
